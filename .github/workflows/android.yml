name: Android APK

# Manual (aba Actions → Android APK → Run workflow) ou ao enviar uma tag de versão (ex.: v0.5.0).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # necessário para publicar o Release nas tags

jobs:
  apk:
    name: Gerar APK de depuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          npm run android:apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: release/*.apk
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.apk --title "$GITHUB_REF_NAME" --generate-notes
